name: Apply Stridulate v2.5 changes

on:
  push:
    branches: [log-unknowns-map]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: log-unknowns-map
          fetch-depth: 0

      - name: Assemble and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-v25/part* > /tmp/stridulate-v25.b64
          base64 --decode /tmp/stridulate-v25.b64 > /tmp/stridulate-v25.tar.gz
          echo "673d2079e090fa33ed081927c5e18b2c9bfb3f5733fe11e469371f04005c9515  /tmp/stridulate-v25.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/stridulate-v25.tar.gz
          rm -rf .github/patch-v25 .github/workflows/source-snapshot-v25.yml

      - name: Verify project contracts
        run: python verification/verify_ci.py

      - name: Commit feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Log, Unknowns, regional map, and audio references"
          git push origin HEAD:log-unknowns-map
