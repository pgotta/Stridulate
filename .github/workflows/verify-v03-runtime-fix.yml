name: Verify v0.3 J1 runtime fix

on:
  push:
    branches: [agent/fix-v0.3-j1-startup-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply candidate fix
        shell: bash
        run: |
          cat .tmp-v03-fix/part*.patchpart > /tmp/v03-fix.patch
          git apply --check /tmp/v03-fix.patch
          git apply /tmp/v03-fix.patch
          rm -rf .tmp-v03-fix
          rm -f .github/workflows/verify-v03-runtime-fix.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source contracts
        run: python verification/verify_final_j_android.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and build external-runtime mode
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pstridulate.bundleJ1Runtime=false assembleDebug

      - name: Verify APK contract
        run: python verification/verify_final_j_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare clean patched source artifact
        shell: bash
        run: |
          rm -rf app/build .gradle .git
          printf '%s\n' 'Candidate source compiled successfully in GitHub Actions.' > CI_FIX_BUILD_PASS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stridulate-v0.3-j1-runtime-fix-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
