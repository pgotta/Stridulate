name: Apply verified v0.3 runtime fix

on:
  push:
    branches: [agent/fix-v0.3-j1-startup-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-v0.3-j1-startup-runtime
          fetch-depth: 0
      - name: Apply verified patch and clean temporary files
        shell: bash
        run: |
          cat .tmp-v03-fix/part*.patchpart > /tmp/v03-fix.patch
          git apply --check /tmp/v03-fix.patch
          git apply /tmp/v03-fix.patch
          rm -rf .tmp-v03-fix
          rm -f .github/workflows/verify-v03-runtime-fix.yml
          rm -f .github/workflows/apply-v03-fix.yml
          git config user.name 'pgotta'
          git config user.email '168211683+pgotta@users.noreply.github.com'
          git add -A
          git commit -m 'Fix v0.3 frozen J1 runtime bootstrap'
          git push origin HEAD:agent/fix-v0.3-j1-startup-runtime
