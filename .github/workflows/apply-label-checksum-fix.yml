name: Apply runtime labels checksum fix

on:
  push:
    branches: [fix-runtime-label-checksum]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-runtime-label-checksum
          fetch-depth: 0

      - name: Patch runtime and add packaged-APK verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          classifier = Path('app/src/main/java/com/pgotta/stridulate/classifier/TfLiteClassifier.kt')
          text = classifier.read_text(encoding='utf-8')
          old_check = '''        require(sha256(labelBytes).equals(metadata.labelsSha256, ignoreCase = true)) {
              "labels.txt does not match the active model metadata checksum."
          }
          '''
          new_check = '''        require(labelsChecksumMatches(labelBytes, metadata.labelsSha256)) {
              "labels.txt does not match the active model metadata checksum."
          }
          '''
          if old_check not in text:
              raise SystemExit('Expected labels checksum block was not found')
          text = text.replace(old_check, new_check, 1)

          old_hash = '''    private fun sha256(bytes: ByteArray): String =
              MessageDigest.getInstance("SHA-256").digest(bytes).joinToString("") { "%02x".format(it) }
          '''
          new_hash = '''    /**
               * Git may materialize text assets with LF or CRLF line endings. The model
               * metadata checksum was produced from the original CRLF labels file, so
               * compare the exact bytes first and then the two newline-only variants.
               * No label text, ordering, whitespace, or blank lines are otherwise changed.
               */
              private fun labelsChecksumMatches(bytes: ByteArray, expected: String): Boolean {
                  val text = bytes.toString(Charsets.UTF_8)
                  val lf = text.replace("\\r\\n", "\\n").replace('\\r', '\\n')
                  val candidates = listOf(
                      bytes,
                      lf.toByteArray(Charsets.UTF_8),
                      lf.replace("\\n", "\\r\\n").toByteArray(Charsets.UTF_8)
                  )
                  return candidates.any { sha256(it).equals(expected, ignoreCase = true) }
              }

              private fun sha256(bytes: ByteArray): String =
                  MessageDigest.getInstance("SHA-256").digest(bytes).joinToString("") { "%02x".format(it) }
          '''
          if old_hash not in text:
              raise SystemExit('Expected SHA-256 helper was not found')
          classifier.write_text(text.replace(old_hash, new_hash, 1), encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          build = gradle.read_text(encoding='utf-8')
          build = build.replace('versionCode = 13', 'versionCode = 14', 1)
          build = build.replace('versionName = "2.4.0"', 'versionName = "2.4.1"', 1)
          gradle.write_text(build, encoding='utf-8')

          verifier = Path('verification/verify_apk_assets.py')
          verifier.write_text('''#!/usr/bin/env python3
          """Verify that the packaged APK assets satisfy the Android runtime contract."""

          from __future__ import annotations

          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path


          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()


          def main() -> None:
              apk = Path(sys.argv[1] if len(sys.argv) > 1 else "app/build/outputs/apk/debug/app-debug.apk")
              if not apk.is_file():
                  raise AssertionError(f"APK not found: {apk}")

              with zipfile.ZipFile(apk) as archive:
                  label_bytes = archive.read("assets/labels.txt")
                  metadata = json.loads(archive.read("assets/model_meta.json"))
                  reliability = json.loads(archive.read("assets/android_reliability.json"))

              expected = metadata["labels_sha256"].lower()
              text = label_bytes.decode("utf-8")
              lf_text = text.replace("\\r\\n", "\\n").replace("\\r", "\\n")
              variants = {
                  "raw": label_bytes,
                  "lf": lf_text.encode("utf-8"),
                  "crlf": lf_text.replace("\\n", "\\r\\n").encode("utf-8"),
              }
              hashes = {name: sha256(data) for name, data in variants.items()}
              if expected not in hashes.values():
                  raise AssertionError(
                      "Packaged labels.txt fails the runtime checksum contract: "
                      f"expected={expected}, candidates={hashes}"
                  )

              labels = [line.strip() for line in lf_text.splitlines() if line.strip()]
              if len(labels) != metadata["classes"]:
                  raise AssertionError("Packaged labels count does not match model metadata")
              if labels[metadata["unknown_index"]] != metadata["unknown_label"]:
                  raise AssertionError("Packaged unknown label/index contract is invalid")
              if reliability["model_labels_sha256"].lower() != expected:
                  raise AssertionError("Packaged reliability metadata uses a different labels checksum")

              matched = next(name for name, digest in hashes.items() if digest == expected)
              print(f"Packaged model assets verified; labels checksum matched via {matched} representation.")


          if __name__ == "__main__":
              main()
          ''').replace('\n          ', '\n').lstrip(), encoding='utf-8')

          workflow = Path('.github/workflows/android-build.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          marker = '''          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

          - name: Upload Gradle build log
          '''
          replacement = '''          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

          - name: Verify packaged model assets
            run: python verification/verify_apk_assets.py app/build/outputs/apk/debug/app-debug.apk

          - name: Upload Gradle build log
          '''
          if marker not in workflow_text:
              raise SystemExit('Expected Android build workflow marker was not found')
          workflow.write_text(workflow_text.replace(marker, replacement, 1), encoding='utf-8')

          Path('.github/workflows/apply-label-checksum-fix.yml').unlink()
          PY

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix runtime labels checksum across line endings"
          git push origin HEAD:fix-runtime-label-checksum
