name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Materialize persistent live review changes
        shell: bash
        run: |
          set -euo pipefail
          for patch_file in \
            verification/ci_live_review_vm.patch \
            verification/ci_live_review_main.patch \
            verification/ci_live_review_listen.patch \
            verification/ci_live_review_build.patch \
            verification/ci_live_review_verfinal.patch \
            verification/ci_live_review_vernew.patch
          do
            if git apply --check "$patch_file"; then
              git apply "$patch_file"
            elif git apply --reverse --check "$patch_file"; then
              echo "$patch_file already materialized"
            else
              echo "$patch_file is neither applicable nor already applied"
              exit 1
            fi
          done

          if ! git diff --quiet -- \
            app/src/main/java/com/pgotta/stridulate/ui/StridulateViewModel.kt \
            app/src/main/java/com/pgotta/stridulate/MainActivity.kt \
            app/src/main/java/com/pgotta/stridulate/ui/screens/ListenScreen.kt \
            app/build.gradle.kts \
            verification/verify_final_j_android.py \
            verification/verify_live_review_latch.py
          then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/src/main/java/com/pgotta/stridulate/ui/StridulateViewModel.kt \
              app/src/main/java/com/pgotta/stridulate/MainActivity.kt \
              app/src/main/java/com/pgotta/stridulate/ui/screens/ListenScreen.kt \
              app/build.gradle.kts \
              verification/verify_final_j_android.py \
              verification/verify_live_review_latch.py
            git commit -m "Keep live insect result until QA verdict"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen J.1 Android contracts
        run: python verification/verify_final_j_android.py

      - name: Verify beta QA feedback contracts
        run: python verification/verify_qa_feedback.py

      - name: Verify insect gate and live tuning contracts
        run: python verification/verify_possible_match_gate.py

      - name: Verify dual-model shadow comparison contracts
        run: python verification/verify_dual_model_comparison.py

      - name: Verify HEARD NOW marker scrolling contract
        run: python verification/verify_heard_now_marker_scroll.py

      - name: Verify persistent live review contract
        run: python verification/verify_live_review_latch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify frozen J.1 APK assets
        run: python verification/verify_final_j_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
