name: Apply v0.3 insect front gate

on:
  push:
    branches: [agent/v0.3-insect-front-gate]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Add raw insect-signal front gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.3-insect-front-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_front_gate_patch.py
          python verification/verify_final_j_android.py
          python verification/verify_qa_feedback.py
          python verification/verify_possible_match_gate.py
      - name: Commit source changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pgotta"
          git config user.email "168211683+pgotta@users.noreply.github.com"
          git add app/src/main/java verification
          echo "Changed source files:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -ge 15
          git commit -m "Add raw insect-signal front gate"
          git push origin HEAD:agent/v0.3-insect-front-gate
