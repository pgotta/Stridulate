name: Apply live possible results
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = ""
          Path('/tmp/live_top3.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          patch -p1 < /tmp/live_top3.patch
          python verification/verify_final_j_android.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name pgotta
          git config user.email 168211683+pgotta@users.noreply.github.com
          git rm .github/workflows/apply-live-top3.yml
          git add app/src/main/java/com/pgotta/stridulate/ui/StridulateViewModel.kt app/src/main/java/com/pgotta/stridulate/MainActivity.kt app/src/main/java/com/pgotta/stridulate/ui/screens/ListenScreen.kt app/src/main/java/com/pgotta/stridulate/ui/screens/ResultScreen.kt verification/verify_final_j_android.py
          git commit -m "Restore live Top 3 possible results below J1 gate"
          git push origin HEAD:agent/v0.3-live-possible-top3
