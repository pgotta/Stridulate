name: Feature request
description: Suggest a product, field-guide, model, privacy, or testing improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Biological or technical evidence
      description: Include sources when proposing range, season, call, or temperature behavior.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or offline considerations
