name: Apply v0.3 live noise gate

on:
  push:
    branches: [agent/v0.3-live-noise-gate]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.3-live-noise-gate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source patch
        run: python tools/apply_v03_live_noise_gate.py

      - name: Verify source contracts before commit
        run: |
          python verification/verify_final_j_android.py
          python verification/verify_qa_feedback.py
          python verification/verify_possible_match_gate.py

      - name: Commit source changes
        shell: bash
        run: |
          # GitHub Apps cannot push workflow-file changes without special workflow permission.
          # Revert the normal CI workflow edit here; the PR's existing Android CI still compiles the app.
          git checkout -- .github/workflows/android-build.yml
          git config user.name "pgotta"
          git config user.email "168211683+pgotta@users.noreply.github.com"
          git add -A
          git commit -m "Add live possible-match noise gate and compact QA panel"
          git push origin HEAD:agent/v0.3-live-noise-gate
