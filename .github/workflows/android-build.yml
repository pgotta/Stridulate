name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false

      - name: Apply staged v2.5 changes
        shell: bash
        run: |
          exec > >(tee apply-diagnostics.txt) 2>&1
          set -euo pipefail
          if [ -d .github/patch-v25 ]; then
            python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('.github/patch-v25/part00')
          data = bytearray(path.read_bytes())
          if sha256(data).hexdigest() == '93227a3e0b598e003ac500c78d4f13c4ab80e10228c1b95955e71e0ab0e4d8ba':
              print('part00 already has the expected checksum')
          else:
              assert len(data) == 18000
              assert data[15093] == ord('W'), f'unexpected byte at correction point: {data[15093]!r}'
              data[15093] = ord('V')
              actual = sha256(data).hexdigest()
              assert actual == '93227a3e0b598e003ac500c78d4f13c4ab80e10228c1b95955e71e0ab0e4d8ba', actual
              path.write_bytes(data)
              print('Corrected the single altered byte in part00')
          PY
            cat \
              .github/patch-v25/part00 \
              .github/patch-v25/part01 \
              .github/patch-v25/part02 \
              .github/patch-v25/part03-fixed \
              .github/patch-v25/part04 \
              > /tmp/stridulate-v25.b64
            base64 --decode /tmp/stridulate-v25.b64 > /tmp/stridulate-v25.tar.gz
            gzip -t /tmp/stridulate-v25.tar.gz
            echo "673d2079e090fa33ed081927c5e18b2c9bfb3f5733fe11e469371f04005c9515  /tmp/stridulate-v25.tar.gz" | sha256sum --check --strict
            tar -xzf /tmp/stridulate-v25.tar.gz

            # GitHub Actions may update application source, but its token cannot rewrite
            # workflow files. Keep the currently authorized workflows in this commit;
            # they are cleaned up separately through the GitHub connector.
            git checkout HEAD -- .github/workflows
            rm -rf .github/patch-v25 .github/v25-trigger
            echo "apply-diagnostics.txt" >> .git/info/exclude

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Improve Log, Unknowns, regional map, and audio references"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-v25-patch-diagnostics
          path: apply-diagnostics.txt
          if-no-files-found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify model and project contracts
        run: python verification/verify_ci.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify packaged model assets
        run: python verification/verify_apk_assets.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
