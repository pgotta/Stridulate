name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Materialize HEARD NOW scrolling marker fix on verification branch
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check verification/ci_heard_now_scroll.patch; then
            git apply verification/ci_heard_now_scroll.patch
          elif git apply --reverse --check verification/ci_heard_now_scroll.patch; then
            echo "HEARD NOW scrolling marker fix is already materialized."
          else
            echo "Patch is neither cleanly applicable nor already applied."
            exit 1
          fi
          if ! git diff --quiet -- app/src/main/java/com/pgotta/stridulate/ui/screens/ListenScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pgotta/stridulate/ui/screens/ListenScreen.kt
            git commit -m "Fix HEARD NOW marker scrolling with spectrogram"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen J.1 Android contracts
        run: python verification/verify_final_j_android.py

      - name: Verify beta QA feedback contracts
        run: python verification/verify_qa_feedback.py

      - name: Verify insect gate and live tuning contracts
        run: python verification/verify_possible_match_gate.py

      - name: Verify dual-model shadow comparison contracts
        run: python verification/verify_dual_model_comparison.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify frozen J.1 APK assets
        run: python verification/verify_final_j_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
