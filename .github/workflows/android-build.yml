name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false

      - name: Repair Kotlin multiline string
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/pgotta/stridulate/ui/screens/OtherScreens.kt')
          text = path.read_text(encoding='utf-8')
          broken = '"No saved recordings yet.\nTap Listen to start rolling identification."'
          fixed = '"No saved recordings yet.\\nTap Listen to start rolling identification."'
          if fixed in text:
              print('Kotlin string is already repaired')
          elif broken in text:
              path.write_text(text.replace(broken, fixed, 1), encoding='utf-8')
              print('Repaired Kotlin multiline string')
          else:
              raise SystemExit('Expected Log empty-state text was not found')
          PY
          if ! git diff --quiet -- app/src/main/java/com/pgotta/stridulate/ui/screens/OtherScreens.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/pgotta/stridulate/ui/screens/OtherScreens.kt
            git commit -m "Fix Log empty-state Kotlin string"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify model and project contracts
        run: python verification/verify_ci.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify packaged model assets
        run: python verification/verify_apk_assets.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
