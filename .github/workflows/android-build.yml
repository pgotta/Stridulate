name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen J.1 Android contracts
        run: python verification/verify_final_j_android.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify frozen J.1 APK assets
        run: python verification/verify_final_j_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare standalone Android Studio project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon wrapper
          test -f gradlew.bat
          mkdir -p "$RUNNER_TEMP/Stridulate-Android-v0.3-Android-Studio"
          rsync -a ./ "$RUNNER_TEMP/Stridulate-Android-v0.3-Android-Studio/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='**/build/' \
            --exclude='*.apk' \
            --exclude='*.aab' \
            --exclude='gradle-build.log'
          printf '%s\n' \
            'STRIDULATE v0.3 - ANDROID STUDIO PROJECT' \
            '' \
            'Open THIS folder in Android Studio.' \
            'No Git installation is required.' \
            'Wait for Gradle sync, then use Build > Generate App Bundles or APKs > Generate APKs.' \
            '' \
            'The large Perch/J.1 runtime files are intentionally not embedded in the APK.' \
            'Use the separate in-place installer package when updating the existing field-test phone.' \
            > "$RUNNER_TEMP/Stridulate-Android-v0.3-Android-Studio/OPEN_THIS_FOLDER_IN_ANDROID_STUDIO.txt"

      - name: Upload standalone Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: Stridulate-Android-v0.3-Android-Studio-Project
          path: ${{ runner.temp }}/Stridulate-Android-v0.3-Android-Studio
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stridulate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
