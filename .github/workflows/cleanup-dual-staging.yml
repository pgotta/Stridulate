name: Cleanup dual staging

on:
  push:
    branches:
      - agent/v0.3-dual-model-fine-tuning

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message != 'cleanup dual staging files' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.3-dual-model-fine-tuning
          fetch-depth: 0
      - name: Remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/dual_* CLEANUP_SENTINEL.tmp noop.txt noop2.txt noop3.txt noop4.txt
          git config user.name "pgotta"
          git config user.email "168211683+pgotta@users.noreply.github.com"
          git add -A tools CLEANUP_SENTINEL.tmp noop.txt noop2.txt noop3.txt noop4.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "cleanup dual staging files"
          git push origin HEAD:agent/v0.3-dual-model-fine-tuning
